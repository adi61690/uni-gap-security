<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Uni-Gap Security — Interactive Preview</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);transition:.3s}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:17px;display:flex;gap:10px;align-items:center;padding:8px 10px 18px}.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--iris),var(--mint));display:grid;place-items:center;color:#fff;font-weight:900}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;cursor:pointer;font-size:13px;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:var(--bg2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--iris)}.side-bottom{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--bg2);color:var(--muted)}.main{flex:1;min-width:0}.topbar{height:68px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.search{min-width:320px;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--bg2);padding:9px 12px;border-radius:12px;color:var(--muted);cursor:pointer}.top-actions{display:flex;gap:8px;align-items:center}.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--iris),var(--apricot));color:white;display:grid;place-items:center;font-weight:800;cursor:pointer}.content{padding:24px;max-width:1600px;margin:0 auto}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:4px}.title{font-size:28px;font-weight:800;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.pad{padding:18px}.metrics{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:16px 0}.metric{padding:15px}.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:24px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gridAuto{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.mt{margin-top:14px}.bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--iris),var(--mint))}.chart{height:260px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.small{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}.table th{color:var(--muted);font-weight:700}.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.critical{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}.high{background:color-mix(in srgb,var(--apricot) 14%,transparent);color:#bd5a37}.medium{background:color-mix(in srgb,var(--gold) 14%,transparent);color:#927122}.low{background:color-mix(in srgb,var(--mint) 14%,transparent);color:#267a65}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:700}.btn.primary{background:var(--iris);color:#fff;border-color:var(--iris)}.btn.danger{background:var(--coral);color:#fff;border-color:var(--coral)}.btn:hover{transform:translateY(-1px)}select,input{color:var(--text)}.input{background:var(--surface);border:1px solid var(--border);padding:10px 12px;border-radius:11px;outline:none;width:100%}.panel{position:fixed;right:20px;top:76px;width:360px;max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:14px;z-index:60}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-18px 0 55px rgba(0,0,0,.2);z-index:50;padding:22px;overflow:auto}.overlay{position:fixed;inset:0;background:rgba(15,12,20,.35);z-index:40}.modal{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(720px,92vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;z-index:70;box-shadow:0 30px 90px rgba(0,0,0,.25)}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(124,92,252,.14),transparent 34%),radial-gradient(circle at 80% 30%,rgba(88,214,179,.11),transparent 30%),var(--bg)}.login-card{width:min(460px,100%);padding:30px}.topology{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:center}.node{padding:14px 8px;text-align:center;border:1px solid var(--border);border-radius:14px;background:var(--soft);font-size:11px}.arrow{text-align:center;color:var(--muted)}.list{display:grid;gap:8px}.list button{border:1px solid var(--border);background:var(--soft);border-radius:12px;padding:11px;text-align:left;color:var(--text);cursor:pointer}.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:12px;z-index:100;box-shadow:var(--shadow);font-size:12px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--border);background:var(--surface);padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer}.seg button.active{background:var(--iris);color:#fff;border-color:var(--iris)}.kpi{font-size:30px;font-weight:900}.footer{padding:20px 24px;color:var(--muted);font-size:11px}.flow{height:12px;background:var(--bg2);border-radius:999px;overflow:hidden}.flow i{display:block;height:100%;width:72%;background:linear-gradient(90deg,var(--iris),var(--mint));animation:flow 2s linear infinite}@keyframes flow{from{transform:translateX(-20%)}to{transform:translateX(120%)}}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr}.topology{grid-template-columns:repeat(3,1fr)}.search{min-width:180px}}
@media(max-width:760px){.sidebar{display:none}.content{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.topbar{padding:0 12px}.search{flex:1;min-width:0}.title{font-size:23px}.topology{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
</style></head><body>
<div id="root"></div>
<script>
const classes=['DDoS','Botnet C2','DGA / DNS Tunneling','Encrypted Malware','Recon / Port Scan','Data Exfiltration'];
const icons={Overview:'⌂',Traffic:'◈',Threats:'!', 'AI Lab':'✦',Evidence:'◌',Network:'⌁','Data Diode':'→', 'PCAP Replay':'▣',Incidents:'△','Threat Hunt':'⌕',Analytics:'▥',Reports:'▤',Audit:'✓',Settings:'⚙'};
let alerts=Array.from({length:12},(_,i)=>({timestamp:new Date(Date.now()-i*67000).toISOString(),flow_id:'FLOW-'+(Math.random().toString(16).slice(2,8)).toUpperCase(),threat_class:classes[i%6],threat_subtype:['SYN flood','Beaconing','DGA lexical anomaly','Encrypted session anomaly','Port scan','Outbound burst'][i%6],severity:['High','Medium','Critical','High','Medium','Low'][i%6],confidence:[.947,.892,.981,.934,.918,.861][i%6],source_ip:['10.24.3.17','10.24.8.22','10.24.7.5','10.24.14.9'][i%4],destination_ip:['172.16.4.8','172.16.9.21','172.16.12.41','172.16.18.7'][i%4],destination_port:[443,53,80,8443,22,443][i%6],protocol:['TCP','DNS','TCP','QUIC','TCP','HTTPS'][i%6],evidence:{periodicity_score:.91,iat_cv:.08,dns_entropy:4.82,fanout:28,outbound_inbound_ratio:6.2}}));
let audit=[{timestamp:new Date().toISOString(),analyst:'Analyst',role:'SOC Analyst',event:'Session started',status:'Success',session:'DEMO-001'}];
let notifications=[{text:'New critical threat detected',time:'Just now',unread:true},{text:'Demo stream connected',time:'1 min',unread:true},{text:'Passive observation active',time:'3 min',unread:false}];
let state={logged:false,page:'Overview',theme:localStorage.getItem('ugt')||'light',monitoring:true,paused:false,selected:null,notify:false,profile:false,command:false,json:false,replay:0,replayState:'Ready',range:'15m',metric:'Precision',evidence:'Entropy',report:false,toast:null};
const root=document.getElementById('root'); document.documentElement.dataset.theme=state.theme;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function toast(t){state.toast=t;render();clearTimeout(window.__tt);window.__tt=setTimeout(()=>{state.toast=null;render()},2200)}
function addAudit(event){audit.unshift({timestamp:new Date().toISOString(),analyst:'Analyst',role:'SOC Analyst',event,status:'Success',session:'DEMO-001'});}
function badge(s){return `<span class="badge ${s.toLowerCase()}">${esc(s)}</span>`}
function metric(label,value){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function chart(seed=1){let pts=[];for(let i=0;i<16;i++){let y=55-(Math.sin(i*.8+seed)*22+Math.sin(i*.2)*10);pts.push(`${i*6.66},${y}`)}return `<div class="chart"><svg viewBox="0 0 100 70" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--iris')}"/><stop offset="1" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--mint')}"/></linearGradient></defs><path d="M0 65 H100" stroke="var(--border)" fill="none"/><polyline fill="none" stroke="url(#g)" stroke-width="1.4" points="${pts.join(' ')}"/><polyline fill="url(#g)" opacity=".1" stroke="none" points="0,70 ${pts.join(' ')} 100,70"/></svg></div>`}
function pageHeader(title,eyebrow=''){return `<div class="eyebrow">${eyebrow||'Passive AI monitoring'}</div><div class="row space" style="align-items:end"><h1 class="title">${title}</h1><div class="pill">READ-ONLY OBSERVATION · ONE-WAY INGEST · DEMO DATA</div></div>`}
function overview(){return `<div>${pageHeader('Threat Center','Good morning, Analyst')}<div class="card pad mt row space"><div><div class="row" style="align-items:center"><span style="width:9px;height:9px;background:var(--mint);border-radius:50%"></span><b>SYSTEM LIVE</b><span class="pill">DEMO DATA</span></div><div class="small" style="margin-top:5px">Passive observation active · no return path · metadata-only analysis</div></div><button class="btn ${state.monitoring?'danger':'primary'}" onclick="toggleMonitor()">${state.monitoring?'Pause monitoring':'Resume monitoring'}</button></div><div class="metrics">${metric('Observed flows','1.2M')}${metric('Active threats',alerts.length)}${metric('Critical',alerts.filter(x=>x.severity==='Critical').length)}${metric('AI confidence',(alerts.reduce((s,x)=>s+x.confidence,0)/alerts.length*100).toFixed(1)+'%')}${metric('Throughput','2.4 Gbps')}${metric('Detection latency','42 ms')}${metric('Flow rate','18.4K/s')}</div><div class="grid2"><div class="card pad"><div class="row space"><div><b>Live traffic</b><div class="small">Streaming telemetry · Mbps · ${state.range}</div></div><span class="pill">${state.monitoring?'LIVE':'PAUSED'}</span></div>${chart(2)}</div><div class="card pad"><b>Threat distribution</b><div class="small">Click a category to filter threats</div><div class="mt list">${classes.map((c,i)=>`<button onclick="jumpThreat('${c}')"><div class="row space"><span>${c}</span><b>${[32,24,18,12,9,5][i]}%</b></div><div class="bar mt"><span style="width:${[32,24,18,12,9,5][i]}%"></span></div></button>`).join('')}</div></div></div><div class="grid2 mt"><div class="card pad"><b>Threat timeline</b><div class="list mt">${alerts.slice(0,6).map(a=>`<button onclick='openAlert(${JSON.stringify(a).replaceAll("'","&#39;")})'><div class="row"><span class="mono small">${new Date(a.timestamp).toLocaleTimeString()}</span>${badge(a.severity)}<span style="flex:1;font-weight:700">${a.threat_class}</span><span class="mono small">${(a.confidence*100).toFixed(1)}%</span></div></button>`).join('')}</div></div><div class="card pad"><b>AI Confidence</b><div class="kpi mt">96.4%</div><div class="bar mt"><span style="width:96.4%"></span></div><div class="grid3 mt"><div><b>High</b><div class="small">≥90%</div></div><div><b>Medium</b><div class="small">75–89%</div></div><div><b>Low</b><div class="small">&lt;75%</div></div></div></div></div><div class="card pad mt"><div class="row space"><div><b>ONE-WAY SECURITY BOUNDARY</b><div class="small">Forward-only observation is represented. No return or mitigation path.</div></div><span class="pill">NO RETURN PATH</span></div><div class="topology mt">${['Source / Production','Passive Mirror','Hardware Data Diode','Ingestion Enclave','Feature Engine','AI Detection'].map((x,i)=>`<div class="node">${x}<div class="small mono">${i===2?'ONE-WAY ACTIVE':''}</div></div>`).join('')}</div></div></div>`}
function traffic(){return `<div>${pageHeader('Traffic Analytics')}<div class="row mt"><div class="seg">${['1m','5m','15m','1h','6h','24h'].map(x=>`<button class="${state.range===x?'active':''}" onclick="setRange('${x}')">${x}</button>`).join('')}</div><select class="input" style="width:180px" onchange="toast('Protocol filter: '+this.value)"><option>All protocols</option><option>TCP</option><option>UDP</option><option>DNS</option><option>TLS</option><option>QUIC</option></select></div><div class="grid3 mt">${metric('Throughput','2.4 Gbps')}${metric('Packets/sec','18.4K')}${metric('Flows/sec','1.2K')}</div><div class="grid2 mt">${['Mbps','Packets/sec','Flows/sec','Packet size','Flow duration'].map((x,i)=>`<div class="card pad"><b>${x}</b><div class="small">Range ${state.range} · passively observed</div>${chart(i+1)}</div>`).join('')}<div class="card pad"><b>Protocol distribution</b><div class="list mt">${['TCP','UDP','TLS','DNS','QUIC','ICMP'].map((x,i)=>`<button onclick="toast('${x} traffic selected')"><div class="row space"><span>${x}</span><b>${[48,21,15,8,5,3][i]}%</b></div><div class="bar mt"><span style="width:${[48,21,15,8,5,3][i]}%"></span></div></button>`).join('')}</div></div></div></div>`}
function threats(){let q='',tc='All',sv='All',min=0;window.thFilter={q,tc,sv,min};return `<div>${pageHeader('Threats','Live Alerts')}<div class="card pad mt"><div class="grid3"><input id="tq" class="input" placeholder="Search flow, IP, threat, fingerprint" oninput="renderThreatTable()"><select id="ttc" class="input" onchange="renderThreatTable()"><option>All</option>${classes.map(x=>`<option>${x}</option>`).join('')}</select><select id="tsv" class="input" onchange="renderThreatTable()"><option>All</option>${['Critical','High','Medium','Low'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="row mt"><label class="small">Confidence ≥ <span id="minv">0</span>%<input id="tmin" type="range" min="0" max="100" value="0" oninput="document.getElementById('minv').textContent=this.value;renderThreatTable()"></label><button class="btn" onclick="document.getElementById('tq').value='';document.getElementById('ttc').value='All';document.getElementById('tsv').value='All';document.getElementById('tmin').value='0';renderThreatTable()">Clear filters</button></div></div><div id="thTable" class="mt"></div></div>`}
function renderThreatTable(){if(state.page!=='Threats')return;let q=(document.getElementById('tq')?.value||'').toLowerCase(),tc=document.getElementById('ttc')?.value||'All',sv=document.getElementById('tsv')?.value||'All',min=+(document.getElementById('tmin')?.value||0);let arr=alerts.filter(a=>(tc==='All'||a.threat_class===tc)&&(sv==='All'||a.severity===sv)&&a.confidence*100>=min&&JSON.stringify(a).toLowerCase().includes(q));document.getElementById('thTable').innerHTML=`<div class="card tablewrap"><table class="table"><thead><tr><th>Time</th><th>Threat</th><th>Subtype</th><th>Severity</th><th>Confidence</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Flow ID</th></tr></thead><tbody>${arr.map(a=>`<tr onclick='openAlert(${JSON.stringify(a).replaceAll("'","&#39;")})' style="cursor:pointer"><td class="mono">${new Date(a.timestamp).toLocaleTimeString()}</td><td><b>${a.threat_class}</b></td><td>${a.threat_subtype}</td><td>${badge(a.severity)}</td><td class="mono">${(a.confidence*100).toFixed(1)}%</td><td class="mono">${a.source_ip}</td><td class="mono">${a.destination_ip}:${a.destination_port}</td><td>${a.protocol}</td><td class="mono">${a.flow_id}</td></tr>`).join('')}</tbody></table></div>`}
function aiLab(){let models=['Volumetric Detector','C2 Beacon Detector','DNS/DGA Detector','Encrypted Traffic Detector','Recon Detector','Exfiltration Detector'];return `<div>${pageHeader('AI Lab','Model Intelligence')}<div class="gridAuto mt">${models.map((m,i)=>`<button class="card pad" style="text-align:left" onclick="toast('${m} detail opened')"><div class="row space"><b>${m}</b><span class="pill">READY</span></div><div class="grid3 mt"><div><div class="small">Precision</div><b>${[94.2,96.1,93.8,92.7,91.4,90.9][i]}%</b></div><div><div class="small">Recall</div><b>${[96.1,95.6,91.9,94.5,92.8,89.7][i]}%</b></div><div><div class="small">F1</div><b>${[95.1,95.8,92.8,93.6,92.1,90.3][i]}%</b></div></div><div class="small mt">PR-AUC ${[97.3,98.1,95.2,96.0,94.9,93.5][i]}% · latency ${[42,38,35,44,51,47][i]} ms</div></button>`).join('')}</div><div class="card pad mt"><div class="row space"><b>Model comparison</b><div class="seg">${['Precision','Recall','F1','PR-AUC'].map(x=>`<button class="${state.metric===x?'active':''}" onclick="state.metric='${x}';render()">${x}</button>`).join('')}</div></div>${chart(4)}</div></div>`}
function evidence(){let types=['Entropy','FFT','Autocorrelation','IAT','Packet Size','DNS','TLS/QUIC','JA3','JA4','Fan-out','Flow Volume'];return `<div>${pageHeader('Evidence Explorer','Model Evidence')}<div class="grid2 mt"><div class="card pad"><b>Evidence signals</b><div class="list mt">${types.map(x=>`<button class="${state.evidence===x?'active':''}" style="${state.evidence===x?'background:var(--bg2);':''}" onclick="state.evidence='${x}';render()"><div class="row space"><span>${x}</span><span class="pill">VIEW</span></div></button>`).join('')}</div></div><div class="card pad">${evidenceDetail()}</div></div></div>`}
function evidenceDetail(){let d={Entropy:['Current entropy','8.7','Normal range','3.2–6.1','Anomaly score','0.94','The observed distribution is substantially more unpredictable than the learned normal baseline.'],FFT:['Dominant frequency','2.4 Hz','Magnitude','0.82','Periodicity score','0.91','Strong recurring timing structure detected.'],Autocorrelation:['Lag-1 correlation','0.88','Baseline','<0.40','Anomaly score','0.89','Repeated timing structure differs from the learned baseline.'],IAT:['IAT CV','0.08','Baseline','0.25–0.70','Anomaly score','0.86','Inter-arrival timing is unusually regular.'],'Packet Size':['Median packet size','412 B','Normal range','180–360 B','Anomaly score','0.71','Packet-size characteristics differ from the learned baseline.'],DNS:['DNS entropy','4.82','Normal range','2.4–4.1','Anomaly score','0.92','Lexical behavior is anomalous relative to the learned baseline.'],'TLS/QUIC':['TLS version','TLS 1.3','Metadata state','Observed','Anomaly score','0.78','Encrypted session metadata is anomalous; payload was not decrypted.'],JA3:['JA3','771,4865-4867,...','Baseline','Known-set','Anomaly score','0.73','Fingerprint is uncommon in the learned environment baseline.'],JA4:['JA4','t13d1516h2_...','Baseline','Known-set','Anomaly score','0.75','JA4 fingerprint differs from learned baseline frequency.'],'Fan-out':['Unique destination hosts','28','Baseline','1–7','Anomaly score','0.91','Destination expansion is substantially above the learned baseline.'],'Flow Volume':['Outbound/inbound ratio','6.2','Normal range','0.8–2.6','Anomaly score','0.93','Volume asymmetry indicates an unusual outbound-heavy pattern.']}[state.evidence];return `<div><div class="row space"><b>${state.evidence} analysis</b><span class="pill">METADATA ONLY</span></div><div class="grid3 mt">${metric(d[0],d[1])}${metric(d[2],d[3])}${metric(d[4],d[5])}</div>${chart(6)}<div class="card pad" style="background:var(--bg2);box-shadow:none"><b>Plain-language interpretation</b><div class="small mt">${d[6]}</div></div></div>`}
function network(){return `<div>${pageHeader('Network Observation')}<div class="grid3 mt">${metric('Observed direction','Forward only')}${metric('Top destinations','172.16.4.8')}${metric('Fan-out','28 hosts')}</div><div class="grid2 mt"><div class="card pad"><b>Observed topology</b><div class="topology mt">${['Source','Mirror','Data Diode','Ingest','Feature Engine','AI'].map(x=>`<div class="node">${x}</div>`).join('')}</div><div class="small mt">No active probing, scanning, blocking, or mitigation tools are exposed.</div></div><div class="card pad"><b>Protocol distribution</b>${['TCP','UDP','TLS','DNS','QUIC'].map((x,i)=>`<div class="mt"><div class="row space"><span>${x}</span><b>${[54,20,12,8,6][i]}%</b></div><div class="bar"><span style="width:${[54,20,12,8,6][i]}%"></span></div></div>`).join('')}</div></div></div>`}
function diode(){return `<div>${pageHeader('Data Diode','One-way Security Boundary')}<div class="card pad mt"><div class="row space"><div><b style="font-size:20px">ONE-WAY ACTIVE</b><div class="small">Read-only ingest with no return path</div></div><span class="pill">VERIFIED</span></div><div class="flow mt"><i></i></div><div class="topology mt">${['SOURCE NETWORK','PASSIVE MIRROR','HARDWARE DATA DIODE','MONITORING ENCLAVE','FEATURE EXTRACTION','AI ENGINE'].map((x,i)=>`<div class="node"><b>${x}</b><div class="small mono">${i===2?'ONE-WAY ONLY':''}</div></div>`).join('')}</div></div><div class="grid3 mt">${metric('Ingest rate','2.4 Gbps')}${metric('Dropped packets','0.02%')}${metric('Observation uptime','14d 07h')}</div><div class="card pad mt"><b>Why unidirectional monitoring matters</b><p class="small">The monitoring enclave can observe traffic while remaining physically or logically unable to send probes, establish return sessions, or issue inline mitigation commands.</p></div></div>`}
function pcap(){return `<div>${pageHeader('PCAP Replay','Historical Capture Simulation')}<div class="card pad mt"><div class="row space"><div><b>Capture</b><div class="small">Select PCAP/PCAPNG for backend replay</div></div><label class="btn primary">Select PCAP<input type="file" hidden accept=".pcap,.pcapng" onchange="pcapSelected(this)"></label></div>${state.replayState==='Loaded'||state.replayState==='Playing'||state.replayState==='Paused'?`<div class="grid3 mt">${metric('Filename','demo_capture.pcap')}${metric('Packets','184,203')}${metric('Duration','00:12:48')}</div><div class="card pad mt" style="background:var(--bg2);box-shadow:none"><div class="row space"><span>Replay progress</span><b>${state.replay}%</b></div><div class="bar mt"><span style="width:${state.replay}%"></span></div><div class="row mt"><button class="btn primary" onclick="replayStart()">${state.replayState==='Playing'?'Playing…':'Start'}</button><button class="btn" onclick="replayPause()">Pause</button><button class="btn" onclick="replayReset()">Reset</button>${[.25,.5,1,2,5,10].map(x=>`<button class="btn" onclick="toast('Replay speed ${x}x')">${x}x</button>`).join('')}</div></div>`:`<div class="card pad mt" style="text-align:center;background:var(--bg2)"><b>No PCAP loaded</b><div class="small mt">Choose a PCAP/PCAPNG file. Demo mode will simulate processing.</div></div>`}</div></div>`}
function pcapSelected(input){state.replayState='Loaded';state.replay=0;addAudit('PCAP selected');toast('PCAP loaded in demo mode');render()}
function replayStart(){state.replayState='Playing';toast('PCAP replay started');addAudit('PCAP replay started');render();clearInterval(window.__rp);window.__rp=setInterval(()=>{state.replay=Math.min(100,state.replay+5);if(state.replay>=100){clearInterval(window.__rp);state.replayState='Loaded';addAudit('PCAP replay completed');toast('PCAP replay completed')}render()},500)}
function replayPause(){state.replayState='Paused';clearInterval(window.__rp);addAudit('PCAP replay paused');render()}
function replayReset(){clearInterval(window.__rp);state.replay=0;state.replayState='Loaded';addAudit('PCAP replay reset');render()}
function incidents(){return `<div>${pageHeader('Incidents','Grouped observations')}<div class="gridAuto mt">${['INC-2041','INC-2047','INC-2051'].map((id,i)=>`<div class="card pad"><div class="row space"><b>${id}</b>${badge(['High','Medium','Critical'][i])}</div><h3>${['Potential C2 Activity','DNS Anomaly Cluster','Outbound Volume Spike'][i]}</h3><div class="small">${[7,4,3][i]} related alerts · confidence ${[93,89,96][i]}%</div><div class="row mt"><button class="btn" onclick="toast('Incident opened')">Open Incident</button><button class="btn" onclick="toast('Marked reviewed');addAudit('Incident reviewed')">Mark Reviewed</button><button class="btn" onclick="toast('Note added');addAudit('Incident note added')">Add Note</button></div></div>`).join('')}</div></div>`}
function hunt(){return `<div>${pageHeader('Threat Hunt','Analyst search')}<div class="card pad mt"><div class="grid3"><input id="hq" class="input" placeholder="IP / Flow ID / Domain / JA3 / JA4 / Port" oninput="renderHunt()"><select id="hproto" class="input"><option>Any protocol</option><option>TCP</option><option>UDP</option><option>DNS</option><option>QUIC</option></select><select id="hconf" class="input"><option>Any confidence</option><option>≥90%</option><option>≥80%</option></select></div></div><div id="huntResults" class="card pad mt"></div></div>`}
function renderHunt(){let q=(document.getElementById('hq')?.value||'').toLowerCase();let arr=alerts.filter(a=>JSON.stringify(a).toLowerCase().includes(q));document.getElementById('huntResults').innerHTML=arr.length?arr.map(a=>`<button style="width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-bottom:1px solid var(--border);cursor:pointer" onclick='openAlert(${JSON.stringify(a).replaceAll("'","&#39;")})'><div class="row"><span class="mono small">${a.source_ip}</span><b style="flex:1">${a.threat_class}</b>${badge(a.severity)}<span class="mono small">${a.flow_id}</span></div></button>`).join(''):'<div class="small">No matching observations.</div>'}
function analytics(){return `<div>${pageHeader('Analytics','Historical intelligence')}<div class="seg mt">${['1H','6H','24H','7D','30D'].map(x=>`<button class="${state.range===x?'active':''}" onclick="setRange('${x}')">${x}</button>`).join('')}</div><div class="grid2 mt">${['Threats over time','Traffic volume','Detection latency'].map((x,i)=>`<div class="card pad"><b>${x}</b><div class="small">Window ${state.range}</div>${chart(i+7)}</div>`).join('')}<div class="card pad"><b>Threat distribution</b>${classes.map((x,i)=>`<div class="mt"><div class="row space"><span>${x}</span><b>${[32,24,18,12,9,5][i]}%</b></div><div class="bar"><span style="width:${[32,24,18,12,9,5][i]}%"></span></div></div>`).join('')}</div><div class="card pad"><b>Severity distribution</b>${['Critical','High','Medium','Low'].map((x,i)=>`<div class="row space mt"><span>${badge(x)}</span><b>${[8,31,44,17][i]}%</b></div>`).join('')}</div></div></div>`}
function reports(){return `<div>${pageHeader('Reports')}<div class="row mt"><button class="btn primary" onclick="state.report=true;addAudit('Report generated');toast('Report generated');render()">Generate Threat Report</button><button class="btn" onclick="downloadCSV()">Export CSV</button><button class="btn" onclick="downloadJSON()">Export JSON</button><button class="btn" onclick="downloadCSV('excel')">Export Excel</button></div><div class="card pad mt"><b>Recent Reports</b><div class="tablewrap mt"><table class="table"><thead><tr><th>Report</th><th>Generated</th><th>Threats</th><th>Critical</th><th>Confidence</th><th>Status</th></tr></thead><tbody><tr><td>Threat Intelligence Summary</td><td>Just now</td><td>${alerts.length}</td><td>${alerts.filter(a=>a.severity==='Critical').length}</td><td>${(alerts.reduce((s,a)=>s+a.confidence,0)/alerts.length*100).toFixed(1)}%</td><td>${badge('Low')}</td></tr></tbody></table></div></div>${state.report?`<div class="modal"><div class="row space"><h2 style="margin:0">Report Preview</h2><button class="iconbtn" onclick="state.report=false;render()">×</button></div><div class="grid3 mt">${metric('Observation period','Live demo')}${metric('Threats',alerts.length)}${metric('Critical',alerts.filter(a=>a.severity==='Critical').length)}</div><p class="small mt">This browser-generated report summarizes current demo observations and supporting evidence. It does not claim server-side generation.</p><button class="btn primary mt" onclick="state.report=false;render()">Close</button></div>`:''}</div>`}
function auditPage(){let q='';return `<div>${pageHeader('Audit')}<div class="row mt"><input id="aq" class="input" placeholder="Search audit events" oninput="renderAuditTable()"><button class="btn" onclick="downloadAudit()">Export audit</button></div><div id="auditTable" class="card tablewrap mt"></div></div>`}
function renderAuditTable(){let q=(document.getElementById('aq')?.value||'').toLowerCase();let rows=audit.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('auditTable').innerHTML=`<table class="table"><thead><tr><th>Timestamp</th><th>Analyst</th><th>Role</th><th>Event</th><th>Status</th><th>Session</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="mono">${new Date(x.timestamp).toLocaleString()}</td><td>${x.analyst}</td><td>${x.role}</td><td>${x.event}</td><td>${x.status}</td><td class="mono">${x.session}</td></tr>`).join('')}</tbody></table>`}
function settings(){return `<div>${pageHeader('Settings')}<div class="grid2 mt"><div class="card pad"><b>General</b><div class="mt"><label class="small">Theme<select class="input mt" onchange="setTheme(this.value)"><option ${state.theme==='light'?'selected':''}>light</option><option ${state.theme==='dark'?'selected':''}>dark</option><option>system</option></select></label></div><div class="mt"><label class="small">Dashboard density<select class="input mt"><option>comfortable</option><option>compact</option></select></label></div><div class="row space mt"><span>Animations</span><button class="btn" onclick="toast('Animation preference toggled')">On</button></div></div><div class="card pad"><b>Alerts</b><div class="mt"><div class="row space"><span>Confidence threshold</span><b id="svv">${localStorage.getItem('thr')||80}%</b></div><input type="range" min="50" max="100" value="${localStorage.getItem('thr')||80}" oninput="localStorage.setItem('thr',this.value);document.getElementById('svv').textContent=this.value+'%'" class="input" style="padding:0;border:0"></div><div class="row space mt"><span>Live alert notifications</span><button class="btn" onclick="toast('Notifications toggled')">On</button></div><button class="btn primary mt" onclick="addAudit('Settings changed');toast('Settings saved')">Save settings</button></div><div class="card pad"><b>Connection</b><label class="small mt" style="display:block">WebSocket endpoint<input class="input mt" value="ws://localhost:8000/ws/alerts"></label><div class="small mt"><span class="pill">DEMO FALLBACK</span> Backend can replace the mock provider.</div></div><div class="card pad"><b>Database configuration</b><div class="small mt">Credentials are configuration for the backend only; browser code does not connect directly to SQL.</div><select class="input mt"><option>SQL Server</option><option>PostgreSQL</option><option>MySQL</option></select><div class="grid3 mt">${['Host','Port','Database','Username','Password'].map(x=>`<input class="input" placeholder="${x}" type="${x==='Password'?'password':'text'}">`).join('')}</div><button class="btn mt" onclick="toast('Demo connection test: Connected');addAudit('Database connection tested')">Test Connection</button></div></div><div class="card pad mt"><b>Security guardrails</b><div class="grid3 mt">${['Read-only ingest','Passive observation','One-direction architecture','No active probing','No return path','No inline mitigation','No payload decryption','TLS/QUIC metadata only'].map(x=>`<div class="pill" style="justify-content:flex-start">✓ ${x}</div>`).join('')}</div></div></div>`}
function currentPage(){return ({Overview:overview,Traffic:traffic,Threats:threats,'AI Lab':aiLab,Evidence:evidence,Network:network,'Data Diode':diode,'PCAP Replay':pcap,Incidents:incidents,'Threat Hunt':hunt,Analytics:analytics,Reports:reports,Audit:auditPage,Settings:settings}[state.page]||overview)()}
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">U</div>Uni-Gap Security</div><div class="nav">${Object.keys(icons).map(n=>`<button class="${state.page===n?'active':''}" onclick="nav('${n}')"><span>${icons[n]}</span>${n}${n==='Threats'?`<span class="pill" style="margin-left:auto">${alerts.length}</span>`:''}</button>`).join('')}</div><div class="side-bottom"><div class="pill">● LIVE · DEMO DATA</div><div class="small mt">Analyst · SOC Analyst</div><div class="small">Read-only observation</div></div></aside><main class="main"><div class="topbar"><div class="search" onclick="state.command=true;render()">⌕ <span>Search or press Ctrl/⌘ K</span></div><div class="top-actions"><button class="iconbtn" title="Notifications" onclick="state.notify=!state.notify;state.profile=false;render()">🔔${notifications.filter(n=>n.unread).length?'<span style="position:absolute;margin:-6px 0 0 -8px;background:var(--coral);width:8px;height:8px;border-radius:50%"></span>':''}</button><button class="iconbtn" title="Theme" onclick="setTheme(state.theme==='light'?'dark':'light')">${state.theme==='light'?'☼':'☾'}</button><button class="avatar" onclick="state.profile=!state.profile;state.notify=false;render()">A</button></div></div><div class="content">${currentPage()}</div><div class="footer">Uni-Gap Security · Passive AI Monitoring · Connection LIVE · Data diode ACTIVE · Model READY · Latency 42ms</div></main>${state.notify?`<div class="panel"><div class="row space"><b>Notifications</b><button class="btn" onclick="notifications.forEach(n=>n.unread=false);render()">Mark all read</button></div><div class="list mt">${notifications.map(n=>`<button class="list" style="border:1px solid var(--border);background:var(--soft)" onclick="toast('${esc(n.text)}')"><b>${n.text}</b><span class="small">${n.time}${n.unread?' · unread':''}</span></button>`).join('')}</div></div>`:''}${state.profile?`<div class="panel" style="width:220px"><b>Analyst</b><div class="small mt">Role · SOC Analyst</div><div class="small">Session · DEMO-001</div><button class="btn mt" style="width:100%" onclick="toast('Audit activity opened')">Audit activity</button><button class="btn danger mt" style="width:100%" onclick="logout()">Logout</button></div>`:''}${state.selected?`<div class="overlay" onclick="state.selected=null;render()"></div><div class="drawer"><div class="row space"><div><div class="small">Threat investigation</div><h2 style="margin:4px 0">${state.selected.threat_class}</h2></div><button class="iconbtn" onclick="state.selected=null;render()">×</button></div><div class="row mt">${badge(state.selected.severity)}<span class="pill">${(state.selected.confidence*100).toFixed(1)}% confidence</span><span class="pill">${state.selected.protocol}</span></div><div class="grid3 mt">${metric('Flow ID',state.selected.flow_id)}${metric('Source',state.selected.source_ip)}${metric('Destination',state.selected.destination_ip+':'+state.selected.destination_port)}</div><div class="card pad mt"><b>Evidence</b>${Object.entries(state.selected.evidence).map(([k,v])=>`<div class="row space mt"><span class="small">${k}</span><b class="mono">${v}</b></div>`).join('')}</div><div class="card pad mt"><b>Security context</b><div class="small mt">Read-only observation · no payload decryption · no return path.</div></div><div class="row mt"><button class="btn" onclick="state.json=true;render()">View JSON</button><button class="btn primary" onclick="addAudit('Observation saved');toast('Observation saved')">Save Observation</button></div></div>`:''}${state.command?`<div class="overlay" onclick="state.command=false;render()"></div><div class="modal"><div class="row space"><h2 style="margin:0">Command Palette</h2><button class="iconbtn" onclick="state.command=false;render()">×</button></div><input class="input mt" autofocus placeholder="Search threats, flows, pages..." oninput="filterCmd(this.value)"><div id="cmds" class="list mt">${Object.keys(icons).map(n=>`<button onclick="state.command=false;nav('${n}')"><b>${n}</b><span class="small">Open page</span></button>`).join('')}<button onclick="state.command=false;nav('Threats')"><b>Show critical threats</b><span class="small">Action</span></button><button onclick="state.command=false;nav('PCAP Replay')"><b>Open PCAP replay</b><span class="small">Action</span></button></div></div>`:''}${state.json?`<div class="overlay" onclick="state.json=false;render()"></div><div class="modal"><div class="row space"><h2 style="margin:0">Alert JSON</h2><button class="iconbtn" onclick="state.json=false;render()">×</button></div><pre class="card pad mt" style="overflow:auto;background:var(--bg2)">${esc(JSON.stringify(state.selected,null,2))}</pre><div class="row mt"><button class="btn" onclick="navigator.clipboard?.writeText(JSON.stringify(state.selected,null,2));toast('JSON copied')">Copy JSON</button><button class="btn primary" onclick="state.json=false;render()">Close</button></div></div>`:''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}</div>`}
function login(){return `<div class="login"><div class="login-card card"><div class="brand" style="padding:0 0 22px"><div class="brand-mark">U</div><div><div style="font-size:19px">Uni-Gap Security</div><div class="small">AI-based detection for unidirectional traffic</div></div></div><div class="small">Secure analyst access</div><input id="lu" class="input mt" placeholder="Username" value="analyst"><input id="lp" class="input mt" placeholder="Password" type="password" value="analyst123"><label class="small mt" style="display:flex;gap:8px;align-items:center"><input type="checkbox"> Remember session</label><button class="btn primary mt" style="width:100%" onclick="loginAction()">Sign in</button><div class="pill mt">Demo credentials · analyst / analyst123</div><div class="small mt">Passive monitoring only · no active probing · no payload decryption</div></div></div>`}
function loginAction(){if(document.getElementById('lu').value==='analyst'&&document.getElementById('lp').value==='analyst123'){state.logged=true;addAudit('Login');toast('Signed in');render()}else toast('Invalid demo credentials')}
function logout(){addAudit('Logout');state.logged=false;state.profile=false;render()}
function nav(n){state.page=n;state.selected=null;state.notify=false;state.profile=false;state.command=false;render();if(n==='Threats')setTimeout(renderThreatTable,0);if(n==='Threat Hunt')setTimeout(renderHunt,0);if(n==='Audit')setTimeout(renderAuditTable,0)}
function toggleMonitor(){state.monitoring=!state.monitoring;toast(state.monitoring?'Monitoring resumed':'Monitoring paused');render()}
function setRange(x){state.range=x;render()}
function setTheme(t){state.theme=t;localStorage.setItem('ugt',t);document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;render()}
function jumpThreat(c){state.page='Threats';state.filterClass=c;render();setTimeout(()=>{document.getElementById('ttc').value=c;renderThreatTable()},0)}
function openAlert(a){state.selected=a;render()}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function downloadJSON(){download('uni-gap-alerts.json',JSON.stringify(alerts,null,2),'application/json');toast('JSON exported');addAudit('JSON export')}
function downloadCSV(kind){let csv='timestamp,flow_id,threat_class,severity,confidence,source_ip,destination_ip,destination_port,protocol\n'+alerts.map(a=>[a.timestamp,a.flow_id,a.threat_class,a.severity,a.confidence,a.source_ip,a.destination_ip,a.destination_port,a.protocol].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download(kind==='excel'?'alerts.xls':'alerts.csv',csv,'text/csv');toast('Export generated');addAudit(kind==='excel'?'Excel export':'CSV export')}
function downloadAudit(){let csv='timestamp,analyst,role,event,status,session\n'+audit.map(a=>[a.timestamp,a.analyst,a.role,a.event,a.status,a.session].join(',')).join('\n');download('audit.csv',csv,'text/csv');toast('Audit exported')}
function filterCmd(v){document.querySelectorAll('#cmds button').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v.toLowerCase())?'block':'none')}
function render(){root.innerHTML=state.logged?shell():login();document.documentElement.dataset.theme=state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme;if(state.logged){if(state.page==='Threats')setTimeout(renderThreatTable,0);if(state.page==='Threat Hunt')setTimeout(renderHunt,0);if(state.page==='Audit')setTimeout(renderAuditTable,0)}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.logged){state.command=true;render()}}});
setInterval(()=>{if(state.logged&&state.monitoring&&!state.paused){if(Math.random()<.22){let c=classes[Math.floor(Math.random()*classes.length)];let a={timestamp:new Date().toISOString(),flow_id:'FLOW-'+Math.random().toString(16).slice(2,8).toUpperCase(),threat_class:c,threat_subtype:'Live anomaly',severity:['Low','Medium','High'][Math.floor(Math.random()*3)],confidence:.82+Math.random()*.15,source_ip:'10.24.'+Math.floor(Math.random()*20)+'.'+Math.floor(Math.random()*200),destination_ip:'172.16.'+Math.floor(Math.random()*20)+'.'+Math.floor(Math.random()*200),destination_port:[53,80,443,8443][Math.floor(Math.random()*4)],protocol:['TCP','UDP','DNS','QUIC'][Math.floor(Math.random()*4)],evidence:{anomaly_score:+(Math.random()*.25+.7).toFixed(2),periodicity_score:+(Math.random()*.25+.65).toFixed(2)}};alerts.unshift(a);alerts=alerts.slice(0,30);notifications.unshift({text:'New '+a.severity.toLowerCase()+' threat detected',time:'now',unread:true});notifications=notifications.slice(0,12);if(state.page==='Threats')renderThreatTable();else render()}}},4000);
render();
</script></body></html>
