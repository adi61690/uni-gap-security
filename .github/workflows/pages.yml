name: deploy-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/uni-gap-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/uni-gap-security/package-lock.json
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
      - name: Copy lab dataset
        run: mkdir -p public/data && cp ../../data/processed/lab_generated_unidirectional_flows.csv public/data/lab_generated_unidirectional_flows.csv
      - name: Build static frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/uni-gap-security/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
