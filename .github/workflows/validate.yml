name: validate

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/uni-gap-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  python-fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dataset generator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python scripts/build_lab_dataset.py
      - run: python -m compileall role1-network-traffic-simulation role2-ingestion-feature-extraction backend role3-flow-ml role4-ml
      - name: Check dataset manifest
        run: python -c "import pandas as pd,json; df=pd.read_csv('data/processed/lab_generated_unidirectional_flows.csv'); m=json.load(open('data/manifests/lab_generated_unidirectional_v1.json',encoding='utf-8')); assert len(df)==m['rows']==7000; assert set(df['label'])=={'BENIGN','SYN_FLOOD','UDP_FLOOD','SLOW_HTTP','DNS_TUNNEL','DGA','C2_BEACON'}; assert df['src_ip'].str.startswith('10.').all(); print('dataset check ok',df.shape)"

  backend-tests:
    runs-on: ubuntu-latest
    needs: python-fast-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/uni-gap-security-backend-only/requirements.txt
      - working-directory: backend/uni-gap-security-backend-only
        run: pytest -q
