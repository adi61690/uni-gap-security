services:
  role3:
    build: ./role3-flow-ml/role3_flow_ml
    ports: ["8002:8002"]
    environment:
      ROLE3_MODEL_DIR: /app/models
    volumes:
      - ./data:/app/data
      - ./role3-flow-ml/role3_flow_ml/models:/app/models

  role4:
    build: ./role4-ml/role4_ml_production
    ports: ["8001:8001"]
    volumes:
      - ./data:/app/data
      - ./role4-ml/role4_ml_production/models:/app/models

  backend:
    build: ./backend/uni-gap-security-backend-only
    depends_on: [role3, role4]
    environment:
      ML_SERVICE_URL: http://role4:8001
      ROLE3_SERVICE_URL: http://role3:8002
      ML_SERVICE_ENABLED: "true"
      ROLE3_SERVICE_ENABLED: "true"
      DEMO_STREAM_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./runtime/backend/storage:/app/storage

  role2:
    build: ./role2-ingestion-feature-extraction/role2_ingestion
    depends_on: [backend]
    environment:
      BACKEND_INGEST_URL: http://backend:8000/api/v1/ingest/flow
    ports: ["8100:8100"]
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend/uni-gap-security
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/alerts
    depends_on: [backend]
    ports: ["3000:3000"]
